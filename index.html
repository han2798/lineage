        .relic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }

            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
        }
        .relic-card:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.12); }
        
        .relic-card.collected { border-color: #4CAF50; background-color: #f0fdf4; }
        .relic-card img { max-width: 100%; height: 55px; object-fit: contain; margin-bottom: 8px; filter: grayscale(100%); opacity: 0.6; transition: filter 0.2s, opacity 0.2s; }
        .relic-card.collected img { filter: grayscale(0%); opacity: 1; }
        
        .relic-name { font-weight: bold; margin-bottom: 4px; font-size: 13px; pointer-events: none; line-height: 1.2; }
        .relic-tags { font-size: 11px; color: #666; background: #e0e0e0; padding: 2px 6px; border-radius: 4px; margin-top: 4px; display: inline-block; pointer-events: none; }
        
        /* 新增：精簡版怪物名稱標籤 */
        .relic-monster { font-size: 11px; color: #999; margin-top: 8px; pointer-events: none; }
        .relic-region { font-size: 11px; color: #1976d2; margin-top: 4px; pointer-events: none; font-weight: bold; }
        .total-progress { font-size: 18px; font-weight: bold; color: #1976d2; }

        ];

        let collectedRelics = JSON.parse(localStorage.getItem('idleLineageRelics_vFinal')) || [];

        function initFilters() {
            const regions = new Set(['所有地區']);
            relicsData.forEach(r => {
                if (r.region) regions.add(r.region);
            });

            const filterSelect = document.getElementById('regionFilter');
            filterSelect.innerHTML = '<option value="所有地區">所有地區</option>';
            
            Array.from(regions).sort().forEach(r => {
                if (r !== '所有地區' && r !== 'BOSS / 特殊區域') {
                    const option = document.createElement('option');
                    option.value = r; 
                    option.text = r;
                    filterSelect.appendChild(option);
                }
            });
            
            // 確保 BOSS / 特殊區域 在最後面
            if (regions.has('BOSS / 特殊區域')) {
                filterSelect.innerHTML += '<option value="BOSS / 特殊區域">BOSS / 特殊區域</option>';
            }
        }

        function toggleRelic(id, element) {
            const index = collectedRelics.indexOf(id);
            if (index === -1) {
                collectedRelics.push(id);
                element.classList.add('collected');
            } else {
                collectedRelics.splice(index, 1);
                element.classList.remove('collected');
            }
            
            setTimeout(() => {
                localStorage.setItem('idleLineageRelics_vFinal', JSON.stringify(collectedRelics));
            }, 0);
            
            updateCountersFast();
        }

        function updateCountersFast() {
            const totalCollected = document.querySelectorAll('.relic-card.collected').length;
            const totalCards = document.querySelectorAll('.relic-card').length;
            
            const filter = document.getElementById('regionFilter').value;
            if (filter === '所有地區') {
                document.getElementById('totalProgressText').innerText = `目前總進度: ${collectedRelics.length} / 366`;
            } else {
                document.getElementById('totalProgressText').innerText = `目前地區進度: ${totalCollected} / ${totalCards}`;
            }
        }

        function createCardHTML(relic, isCollected) {
            let folder = relic.category === '防具' ? 'armors' : (relic.category === '飾品' ? 'accessories' : 'weapons');
            // 若你自行定義了 image 屬性，可以直接用 relic.image
            let imgUrl = relic.image || `https://pp771007.github.io/idle-lineage-class/assets/icons/${folder}/${encodeURIComponent(relic.name)}.png`;

            return `
                <div class="relic-card ${isCollected ? 'collected' : ''}" onclick="toggleRelic(${relic.id}, this)">
                    <img src="${imgUrl}" alt="${relic.name}" onerror="this.src='https://via.placeholder.com/80?text=破圖'">
                    <div class="relic-name">${relic.name}</div>
                    <div class="relic-tags">${relic.category}</div>
                    <div class="relic-monster">🎯 ${relic.monster}</div>
                    <div class="relic-region">📍 ${relic.region}</div>
                </div>
            `;
        }

      function renderView() {
            const container = document.getElementById('mainContainer');
            const selectedRegion = document.getElementById('regionFilter').value;
            // 抓取搜尋框的文字，轉小寫並去除前後空白
            const searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
            let htmlBuffer = [];

            // 雙重過濾：先判斷地區是否符合，再判斷名稱或怪物是否包含關鍵字
            let filteredItems = relicsData.filter(r => {
                const matchRegion = (selectedRegion === '所有地區' || r.region === selectedRegion);
                const matchSearch = (r.name.toLowerCase().includes(searchQuery) || 
                                     r.monster.toLowerCase().includes(searchQuery));
                return matchRegion && matchSearch;
            });

            if (filteredItems.length === 0) {
                htmlBuffer.push('<div style="text-align: center; padding: 40px; color: #666; font-size: 16px;">找不到符合條件的遺物資料。</div>');
            } else {
                htmlBuffer.push('<div class="relic-grid">');
                filteredItems.forEach(relic => {
                    htmlBuffer.push(createCardHTML(relic, collectedRelics.includes(relic.id)));
                });
                htmlBuffer.push('</div>');
            }
            
            container.innerHTML = htmlBuffer.join('');
            updateCountersFast();
        }

        initFilters();
        renderView();
    </script>
